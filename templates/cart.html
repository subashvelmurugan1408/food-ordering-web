<!DOCTYPE html>
<html>

<head>
    <title>Cart</title>
</head>

<body>

<h1>Your Cart</h1>

<table border="1" cellpadding="10">

<tr>

<th>Food</th>
<th>Price</th>
<th>Action</th>

</tr>

{% for item in cart %}

<tr>

<td>{{ item.food_name }}</td>

<td>₹ {{ item.price }}</td>

<td>

<a href="/remove/{{ loop.index0 }}">Remove</a>

</td>

</tr>

{% endfor %}

</table>

<h2>

Total : ₹ {{ total }}

</h2>

<a href="/">Continue Shopping</a>
<a href="/checkout">
    <button>Proceed to Checkout</button>
</a>

</body>

</html>
