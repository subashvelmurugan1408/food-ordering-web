<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
</head>

<body>

<h1>Welcome {{ session['user_name'] }}</h1>

<h2>My Orders</h2>

<table border="1" cellpadding="10">

<tr>

<th>Order ID</th>

<th>Total</th>

<th>Date</th>

</tr>

{% for order in orders %}

<tr>

<td>{{ order.id }}</td>

<td>₹{{ order.total_amount }}</td>

<td>{{ order.order_date }}</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/">Home</a>

<a href="/logout">Logout</a>

</body>

</html>
